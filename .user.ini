; NAAP GSD Trip Ticket — per-directory PHP settings.
; Hostinger (PHP-FPM/LiteSpeed) reads .user.ini for this directory tree.
; Enables Zend OPcache for the app; ignored where the extension is absent.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Request letters are capped at 20 MB by the app; keep PHP in sync so an
; oversized upload is rejected with a clear message instead of an empty $_POST.
upload_max_filesize=20M
post_max_size=24M
